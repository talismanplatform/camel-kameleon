name: Scan vulnerabilities

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main, master]
    paths:
      - 'public/data/versions.json'
      - '.github/workflows/scan.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.read.outputs.refs }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Write public/data/camel_versions.json
        env:
          CAMEL_JBANG_VERSION: '4.22.0'
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          export PATH="$HOME/.jbang/bin:$PATH"
          jbang trust add \
            https://github.com/apache/camel/ \
            https://raw.githubusercontent.com/apache/camel/
          jbang trust list
          jbang "-Dcamel.jbang.version=${CAMEL_JBANG_VERSION}" \
            camel@apache/camel version list --json > /tmp/camel_versions.all.json
          jq -e 'length > 0' /tmp/camel_versions.all.json > /dev/null
          jq --arg today "$(date -u +%Y-%m-%d)" \
            '[.[] | select(.eolDate != null and .eolDate > $today)]' \
            /tmp/camel_versions.all.json > /tmp/camel_versions.json
          jq -e 'length > 0' /tmp/camel_versions.json > /dev/null
          mv /tmp/camel_versions.json public/data/camel_versions.json
          echo "supported releases: $(jq 'length' public/data/camel_versions.json)"

      - name: Write public/data/versions.json
        run: |
          jq '
            def ver: .camelVersion | split(".") | map(tonumber);
            def line: .camelVersion | sub("[.][0-9]+$"; "");
            {
              tags: ([group_by(line)[] | max_by(ver) | "camel-" + .camelVersion] | sort),
              branches: (["main"] + [
                .[] | select(.kind == "lts")
                    | "camel-" + (.camelVersion | sub("[.][0-9]+$"; ".x"))
              ] | unique)
            }' public/data/camel_versions.json > /tmp/versions.json
          jq -e '(.tags | length) > 0' /tmp/versions.json > /dev/null
          mv /tmp/versions.json public/data/versions.json
          cat public/data/versions.json

      - id: read
        name: Read versions.json
        run: |
          refs=$(jq -c '[(.tags // []) + (.branches // []) | .[]] | unique' public/data/versions.json)
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "Scanning: $refs"

      - name: Upload version metadata
        uses: actions/upload-artifact@v7
        with:
          name: version-metadata
          path: |
            public/data/camel_versions.json
            public/data/versions.json
          retention-days: 1
          if-no-files-found: error

  scan:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ref: ${{ fromJson(needs.versions.outputs.refs) }}
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v7

      - name: Clone apache/camel@${{ matrix.ref }}
        run: |
          git clone --depth=1 --single-branch \
            --branch '${{ matrix.ref }}' \
            https://github.com/apache/camel.git camel

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate mvn-tree.json
        working-directory: camel
        run: |
          mvn dependency:tree \
            -DoutputType=json \
            -DoutputFile=mvn-tree.json \
            -Dscope=runtime \
            -q --batch-mode --fail-at-end -Dmaven.wagon.http.retryHandler.count=3
          echo "trees: $(find components core dsl -name mvn-tree.json | wc -l)"

      - name: Collect mvn-tree.json files
        working-directory: camel
        run: |
          mkdir -p '${{ github.workspace }}/public/data/${{ matrix.ref }}/'
          rsync -avm \
            --include='*/' --include='mvn-tree.json' --exclude='*' \
            components core dsl \
            '${{ github.workspace }}/public/data/${{ matrix.ref }}/'

      - name: Install grype
        uses: anchore/scan-action/download-grype@v7
        id: grype

      - name: Scan SBOM
        working-directory: camel
        run: |
          ${{ steps.grype.outputs.cmd }} sbom:./camel-sbom/camel-sbom.json \
            --output=json --file vulnerabilities.json
          {
            echo "SCANNED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GRYPE_VERSION=$(${{ steps.grype.outputs.cmd }} version -o json | jq -r '.version')"
            echo "CAMEL_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Reshape report
        working-directory: camel
        run: |
          jq -c '[.matches[] | {
            name: .artifact.name,
            installed: .artifact.version,
            fixed_in: (if .vulnerability.fix.state == "fixed" then (.vulnerability.fix.versions | join(", ")) else "(" + .vulnerability.fix.state + ")" end),
            type: .artifact.type,
            groupId: .artifact.metadata.pomGroupID,
            artifactId: .artifact.metadata.pomArtifactID,
            vulnerability: .vulnerability.id,
            severity: .vulnerability.severity,
            dataSource: .vulnerability.dataSource,
            description: .vulnerability.description,
            epss: (if .vulnerability.epss and (.vulnerability.epss | length) > 0 then .vulnerability.epss[0].epss else null end),
            risk: .vulnerability.risk
            }]' vulnerabilities.json > vulnerabilities.reshaped.json
          mv vulnerabilities.reshaped.json vulnerabilities.json

      - name: Move report into public/data/${{ matrix.ref }}
        run: |
          target='public/data/${{ matrix.ref }}'
          mv camel/vulnerabilities.json "$target/vulnerabilities.json"
          jq -n \
            --arg ref '${{ matrix.ref }}' \
            --arg scannedAt "$SCANNED_AT" \
            --arg camelCommit "$CAMEL_COMMIT" \
            --arg grypeVersion "$GRYPE_VERSION" \
            --arg runUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --argjson findings "$(jq 'length' "$target/vulnerabilities.json")" \
            '{ref: $ref, scannedAt: $scannedAt, camelCommit: $camelCommit, grypeVersion: $grypeVersion, findings: $findings, runUrl: $runUrl}' \
            > "$target/scan.json"
          cat "$target/scan.json"

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.ref }}
          path: public/data/${{ matrix.ref }}
          retention-days: 1
          if-no-files-found: warn

  publish:
    needs: [versions, scan]
    if: always() && needs.versions.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download version metadata
        uses: actions/download-artifact@v6
        with:
          name: version-metadata
          path: public/data

      - name: Download scan results
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: scan-*
          path: scans

      - name: Move results into public/data
        run: |
          adopted=0
          kept=0
          for ref in $(echo '${{ needs.versions.outputs.refs }}' | jq -r '.[]'); do
            src="scans/scan-$ref"
            if [ ! -s "$src/scan.json" ] || [ ! -s "$src/vulnerabilities.json" ]; then
              echo "::warning::no complete result for $ref, keeping committed data"
              kept=$((kept + 1))
              continue
            fi
            if ! jq -e '.ref and .scannedAt' "$src/scan.json" > /dev/null 2>&1; then
              echo "::warning::unusable scan.json for $ref, keeping committed data"
              kept=$((kept + 1))
              continue
            fi
            rm -rf "public/data/$ref"
            mkdir -p "public/data/$ref"
            cp -R "$src/." "public/data/$ref/"
            adopted=$((adopted + 1))
          done
          echo "refreshed: $adopted, kept as-is: $kept"
          if [ "$adopted" -eq 0 ]; then
            echo '::warning::no ref produced a scan in this run'
          fi

      - name: Write public/data/scan.json index
        run: |
          stamps=""
          while read -r stamp; do
            [ -n "$stamp" ] || continue
            if jq -e '.ref and .scannedAt' "$stamp" > /dev/null 2>&1; then
              stamps="$stamps $stamp"
            else
              echo "::warning::skipping unreadable stamp $stamp"
            fi
          done <<< "$(find public/data -mindepth 2 -maxdepth 2 -name scan.json | sort)"
          if [ -z "$stamps" ]; then
            echo '::warning::no scan.json stamps found, index left untouched'
            exit 0
          fi
          jq -s '{scannedAt: ([.[].scannedAt] | max), refs: sort_by(.ref)}' $stamps \
            > /tmp/scan.json
          jq -e '(.refs | length) > 0' /tmp/scan.json > /dev/null
          mv /tmp/scan.json public/data/scan.json
          cat public/data/scan.json

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'chore: refresh scan data and Camel release metadata'
          git push