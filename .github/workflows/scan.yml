name: Scan vulnerabilities

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main, master]
    paths:
      - 'public/data/versions.json'
      - '.github/workflows/scan.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.read.outputs.refs }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Write public/data/camel_versions.json
        env:
          CAMEL_JBANG_VERSION: '4.22.0'
        run: |
          curl -Ls https://sh.jbang.dev | bash -s - app setup
          export PATH="$HOME/.jbang/bin:$PATH"
          jbang trust add \
            https://github.com/apache/camel/ \
            https://raw.githubusercontent.com/apache/camel/
          jbang trust list
          jbang "-Dcamel.jbang.version=${CAMEL_JBANG_VERSION}" \
            camel@apache/camel version list --json > /tmp/camel_versions.all.json
          jq -e 'length > 0' /tmp/camel_versions.all.json > /dev/null
          jq --arg today "$(date -u +%Y-%m-%d)" \
            '[.[] | select(.eolDate != null and .eolDate > $today)]' \
            /tmp/camel_versions.all.json > /tmp/camel_versions.json
          jq -e 'length > 0' /tmp/camel_versions.json > /dev/null
          mv /tmp/camel_versions.json public/data/camel_versions.json
          echo "supported releases: $(jq 'length' public/data/camel_versions.json)"

      - name: Write public/data/versions.json
        # Every ref carries the Camel version it builds. A tag names its release, so
        # it is known here; a branch only reveals its project.version once checked
        # out, so the scan job resolves it and the publish job writes it back.
        run: |
          jq '
            def ver: .camelVersion | split(".") | map(tonumber);
            def line: .camelVersion | sub("[.][0-9]+$"; "");
            [group_by(line)[] | max_by(ver)] as $latest |
            {
              tags: ([$latest[] | {ref: ("camel-" + .camelVersion), camelVersion: .camelVersion}]
                     | sort_by(.ref)),
              branches: ([{ref: "main"}] + [
                $latest[] | select(.kind == "lts")
                          | {ref: ("camel-" + (.camelVersion | sub("[.][0-9]+$"; ".x")))}
              ] | unique_by(.ref))
            }' public/data/camel_versions.json > /tmp/versions.json
          jq -e '(.tags | length) > 0' /tmp/versions.json > /dev/null
          mv /tmp/versions.json public/data/versions.json
          cat public/data/versions.json

      - id: read
        name: Read versions.json
        run: |
          refs=$(jq -c '[(.tags // []) + (.branches // []) | .[].ref] | unique' public/data/versions.json)
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "Scanning: $refs"

      - name: Upload version metadata
        uses: actions/upload-artifact@v7
        with:
          name: version-metadata
          path: |
            public/data/camel_versions.json
            public/data/versions.json
          retention-days: 1
          if-no-files-found: error

  scan:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        ref: ${{ fromJson(needs.versions.outputs.refs) }}
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v7

      - name: Clone apache/camel@${{ matrix.ref }}
        run: |
          git clone --depth=1 --single-branch \
            --branch '${{ matrix.ref }}' \
            https://github.com/apache/camel.git camel

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve the Camel version of ${{ matrix.ref }}
        working-directory: camel
        run: |
          version=$(mvn -q -N --batch-mode \
            org.apache.maven.plugins:maven-help-plugin:evaluate \
            -Dexpression=project.version -DforceStdout)
          test -n "$version"
          echo "CAMEL_VERSION=$version" >> "$GITHUB_ENV"
          echo "${{ matrix.ref }} builds Camel $version"

      - name: Generate mvn-tree.json
        working-directory: camel
        run: |
          mvn dependency:tree \
            -DoutputType=json \
            -DoutputFile=mvn-tree.json \
            -Dscope=runtime \
            -q --batch-mode --fail-at-end -Dmaven.wagon.http.retryHandler.count=3
          echo "trees: $(find components core dsl -name mvn-tree.json | wc -l)"

      - name: Collect mvn-tree.json files
        working-directory: camel
        run: |
          mkdir -p '${{ github.workspace }}/public/data/${{ matrix.ref }}/'
          rsync -avm \
            --include='*/' --include='mvn-tree.json' --exclude='*' \
            components core dsl \
            '${{ github.workspace }}/public/data/${{ matrix.ref }}/'

      - name: Index the collected modules
        working-directory: public/data/${{ matrix.ref }}
        run: |
          find core components dsl -name mvn-tree.json -printf '%h\n' 2>/dev/null \
            | jq -Rn '[inputs | split("/")]
                | map(select(length > 1))
                | group_by(.[0])
                | map({key: .[0][0], value: map(.[1:] | join("/")) | sort})
                | from_entries' > modules.json
          jq -r 'to_entries | map("\(.key): \(.value | length)") | join(", ")' modules.json

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate sbom.json
        # The committed camel-sbom only covers what the release build declares, so
        # syft walks the checkout itself and catches the artifacts that SBOM omits.
        working-directory: camel
        run: |
          syft . -o json=sbom.json
          jq -e '(.artifacts | length) > 0' sbom.json > /dev/null
          echo "syft catalogued $(jq '.artifacts | length' sbom.json) artifacts"

      - name: Install grype
        uses: anchore/scan-action/download-grype@v7
        id: grype

      - name: Align camel-sbom with ${{ matrix.ref }}
        # camel-sbom/camel-sbom.json is committed to apache/camel and keeps the
        # development version it was generated with, so a release tag ships an SBOM
        # that still calls itself 4.18.0-SNAPSHOT. Rewrite that stale version to the
        # ref's own project.version before grype reads it, otherwise every finding
        # against a Camel artifact is reported and matched at the wrong version.
        working-directory: camel
        run: |
          sbom=camel-sbom/camel-sbom.json
          if [ ! -s "$sbom" ]; then
            echo "::error::$sbom is missing in ${{ matrix.ref }}"
            exit 1
          fi
          stale=$(jq -r '[.metadata.component.version?]
            + [.. | objects | select(.group? == "org.apache.camel") | .version?]
            | map(select(type == "string" and endswith("-SNAPSHOT")))
            | unique | .[0] // empty' "$sbom")
          if [ -z "$stale" ] || [ "$stale" = "$CAMEL_VERSION" ]; then
            echo "sbom already reports $CAMEL_VERSION"
            exit 0
          fi
          echo "::warning::sbom of ${{ matrix.ref }} reports $stale, rewriting to $CAMEL_VERSION"
          # Only Camel's own artifacts are built from source, so the stale version
          # string is theirs alone and can be replaced wherever it appears: component
          # versions, purls, bom-refs and the dependency graph that points at them.
          jq --arg stale "$stale" --arg version "$CAMEL_VERSION" '
            ($stale | gsub("[.]"; "\\.")) as $pattern
            | walk(if type == "string" then gsub($pattern; $version) else . end)' \
            "$sbom" > /tmp/camel-sbom.json
          mv /tmp/camel-sbom.json "$sbom"

      - name: Scan SBOMs
        # Both SBOMs describe the same checkout from a different angle, so a
        # vulnerability the two scans agree on is one finding: key on the
        # vulnerability and the artifact it was matched against, keep one copy.
        working-directory: camel
        run: |
          ${{ steps.grype.outputs.cmd }} sbom:./sbom.json \
            --output=json --file /tmp/vulnerabilities.syft.json
          ${{ steps.grype.outputs.cmd }} sbom:./camel-sbom/camel-sbom.json \
            --output=json --file /tmp/vulnerabilities.camel.json
          jq -s '{matches: ([.[].matches // [] | .[]]
              | unique_by([.vulnerability.id, .artifact.name, .artifact.version]))}' \
            /tmp/vulnerabilities.syft.json /tmp/vulnerabilities.camel.json \
            > vulnerabilities.json
          echo "merged findings: $(jq '.matches | length' vulnerabilities.json)"
          {
            echo "SCANNED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "GRYPE_VERSION=$(${{ steps.grype.outputs.cmd }} version -o json | jq -r '.version')"
            echo "CAMEL_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Reshape report
        working-directory: camel
        run: |
          jq -c '[.matches[] | {
            name: .artifact.name,
            installed: .artifact.version,
            fixed_in: (if .vulnerability.fix.state == "fixed" then (.vulnerability.fix.versions | join(", ")) else "(" + .vulnerability.fix.state + ")" end),
            type: .artifact.type,
            groupId: .artifact.metadata.pomGroupID,
            artifactId: .artifact.metadata.pomArtifactID,
            vulnerability: .vulnerability.id,
            severity: .vulnerability.severity,
            dataSource: .vulnerability.dataSource,
            description: .vulnerability.description,
            epss: (if .vulnerability.epss and (.vulnerability.epss | length) > 0 then .vulnerability.epss[0].epss else null end),
            risk: .vulnerability.risk
            }]' vulnerabilities.json > vulnerabilities.reshaped.json
          mv vulnerabilities.reshaped.json vulnerabilities.json

      - name: Move report into public/data/${{ matrix.ref }}
        run: |
          target='public/data/${{ matrix.ref }}'
          mv camel/vulnerabilities.json "$target/vulnerabilities.json"
          jq -n \
            --arg ref '${{ matrix.ref }}' \
            --arg camelVersion "$CAMEL_VERSION" \
            --arg scannedAt "$SCANNED_AT" \
            --arg camelCommit "$CAMEL_COMMIT" \
            --arg grypeVersion "$GRYPE_VERSION" \
            --arg runUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --argjson findings "$(jq 'length' "$target/vulnerabilities.json")" \
            '{ref: $ref, camelVersion: $camelVersion, scannedAt: $scannedAt, camelCommit: $camelCommit, grypeVersion: $grypeVersion, findings: $findings, runUrl: $runUrl}' \
            > "$target/scan.json"
          cat "$target/scan.json"

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-${{ matrix.ref }}
          path: public/data/${{ matrix.ref }}
          retention-days: 1
          if-no-files-found: warn

  publish:
    needs: [versions, scan]
    if: always() && needs.versions.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Rebasing onto whatever was pushed while the scan ran needs real
          # history, which the default shallow checkout does not have.
          fetch-depth: 0

      - name: Download version metadata
        uses: actions/download-artifact@v6
        with:
          name: version-metadata
          path: public/data

      - name: Download scan results
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: scan-*
          path: scans

      - name: Move results into public/data
        run: |
          adopted=0
          kept=0
          for ref in $(echo '${{ needs.versions.outputs.refs }}' | jq -r '.[]'); do
            src="scans/scan-$ref"
            if [ ! -s "$src/scan.json" ] || [ ! -s "$src/vulnerabilities.json" ]; then
              echo "::warning::no complete result for $ref, keeping committed data"
              kept=$((kept + 1))
              continue
            fi
            if ! jq -e '.ref and .scannedAt' "$src/scan.json" > /dev/null 2>&1; then
              echo "::warning::unusable scan.json for $ref, keeping committed data"
              kept=$((kept + 1))
              continue
            fi
            rm -rf "public/data/$ref"
            mkdir -p "public/data/$ref"
            cp -R "$src/." "public/data/$ref/"
            adopted=$((adopted + 1))
          done
          echo "refreshed: $adopted, kept as-is: $kept"
          if [ "$adopted" -eq 0 ]; then
            echo '::warning::no ref produced a scan in this run'
          fi

      - name: Write public/data/scan.json index
        run: |
          stamps=""
          while read -r stamp; do
            [ -n "$stamp" ] || continue
            if jq -e '.ref and .scannedAt' "$stamp" > /dev/null 2>&1; then
              stamps="$stamps $stamp"
            else
              echo "::warning::skipping unreadable stamp $stamp"
            fi
          done <<< "$(find public/data -mindepth 2 -maxdepth 2 -name scan.json | sort)"
          if [ -z "$stamps" ]; then
            echo '::warning::no scan.json stamps found, index left untouched'
            exit 0
          fi
          jq -s '{scannedAt: ([.[].scannedAt] | max), refs: sort_by(.ref)}' $stamps \
            > /tmp/scan.json
          jq -e '(.refs | length) > 0' /tmp/scan.json > /dev/null
          mv /tmp/scan.json public/data/scan.json
          cat public/data/scan.json

      - name: Match the scanned Camel versions into versions.json
        # scan.json carries the project.version each ref actually built, which is the
        # only source for a branch. Fold it back so versions.json holds the ref to
        # Camel version mapping the dashboard reads, and a ref that failed to scan
        # keeps whatever version it already had.
        run: |
          stamps=$(find public/data -mindepth 2 -maxdepth 2 -name scan.json | sort)
          if [ -z "$stamps" ]; then
            echo '::warning::no scan.json stamps found, versions.json left untouched'
            exit 0
          fi
          # versions.json comes from the artifact and names no version for a branch,
          # so the last commit is what a ref that failed to scan falls back on.
          git show HEAD:public/data/versions.json > /tmp/committed.json 2>/dev/null \
            || echo '{"tags": [], "branches": []}' > /tmp/committed.json
          jq -s '[.[0] | (.tags // []) + (.branches // []) | .[]
                       | select(type == "object" and .ref and .camelVersion)]
                 + [.[1:][] | select(.ref and .camelVersion)]
                 | map({key: .ref, value: .camelVersion}) | from_entries' \
            /tmp/committed.json $stamps > /tmp/scanned.json
          jq --slurpfile scanned /tmp/scanned.json '
            ($scanned[0] // {}) as $byRef
            | def matched: map(if $byRef[.ref] then .camelVersion = $byRef[.ref] else . end);
              .tags |= matched | .branches |= matched' public/data/versions.json \
            > /tmp/versions.json
          jq -e '(.tags | length) > 0' /tmp/versions.json > /dev/null
          mv /tmp/versions.json public/data/versions.json
          cat public/data/versions.json

      - name: Commit
        # The scan job runs for hours, so the branch has usually moved on by the
        # time this step is reached and a plain push is rejected as non
        # fast-forward. Rebase onto the current remote tip and retry; the data
        # under public/data is generated by this run, so a path both sides
        # touched resolves to the freshly scanned copy being replayed.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'chore: refresh scan data and Camel release metadata'

          branch='${{ github.ref_name }}'
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$branch"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push rejected, rebasing onto origin/$branch (attempt $attempt)"
            git fetch origin "$branch"
            if ! git rebase --strategy-option=theirs "origin/$branch"; then
              git rebase --abort || true
              echo "::error::could not rebase onto origin/$branch"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo '::error::giving up after 5 push attempts'
          exit 1
