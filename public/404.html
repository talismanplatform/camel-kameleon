<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Apache Camel Kameleon</title>
    <script>
        // GitHub Pages serves 404.html for any unknown path. Encode the requested
        // route into a query string and bounce to index.html, where the inline
        // script in index.html restores it via history.replaceState.
        (function () {
            var segmentCount = 1; // number of path segments owned by the repo name
            var l = window.location;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        })();
    </script>
</head>
<body></body>
</html>
